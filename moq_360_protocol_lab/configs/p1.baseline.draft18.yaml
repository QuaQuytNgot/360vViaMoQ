# First P1 Series-A template. Generate one copy per Track count and set
# track_ids/tile_ids/per_track_bitrate_bps consistently before a run.
schema_version: 1

protocol: {backend: moqt18, draft: 18, transport: raw_quic}
relay:
  implementation: moqx
  version: pinned-source
  commit: 502b6b8f9ddbf4e61f5efe41e92a3d1df40df3a6
  address: 127.0.0.1
  port: 4433
  path: /moq-relay
  verify_tls: false
experiment:
  test_id: P1
  name: p1-series-a
  duration_s: 33
  repetitions: 1
  seed: p1-series-a-v1
runtime:
  mode: live
  operation: p1_measurement
  adapter_id: Moqt18P1Adapter
  subscriber_id: subscriber_0
  start_delay_ms: 3000
  connect_timeout_s: 15
  receive_timeout_s: 45
  relay_log_path: .relay-src/moqx/logs/p1-smoke-relay.log
workload:
  media_mode: synthetic
  # Case 1 of the 1,2,4,8,16,24-track sweep.  The aggregate is deliberately
  # declared in configuration; do not put this research value in Python.
  track_count: 1
  track_ids: [track_0]
  tile_ids: [tile_0]
  total_offered_bitrate_mbps: 24
  aggregate_bitrate_bps: 24000000
  per_track_bitrate_bps: [24000000]
  group_duration_ms: 1000
  group_count: 30
  objects_per_group: 1
  seed: p1-series-a-v1
  mapping: {track: tile, group: media_fragment, object: deterministic_payload}
network:
  interface: loopback
  bandwidth_mbps:
  rtt_ms:
  loss_percent:
  jitter_ms:
  queue_limit:
  applied_commands: []
playback:
  deadline_ms: 3000
