  aggregate_bitrate_bps: 1000000
  per_track_bitrate_bps: [1000000]
  group_duration_ms: 1000
  group_count: 10
  objects_per_group: 1
  seed: p1-smoke-v1
  mapping: {track: tile, group: media_fragment, object: deterministic_payload}

network:
  interface: loopback
  bandwidth_mbps:
  rtt_ms:
  loss_percent:
  jitter_ms:
  queue_limit:
  applied_commands: []

playback:
  deadline_ms: 3000
