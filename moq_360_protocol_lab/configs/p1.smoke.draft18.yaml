  version: pinned-source
  commit: 502b6b8f9ddbf4e61f5efe41e92a3d1df40df3a6
  address: 127.0.0.1
  port: 4433
  path: /moq-relay
  verify_tls: false

experiment:
  test_id: P1
  name: draft18-relay-p1-smoke
  duration_s: 13
  repetitions: 1
  seed: p1-smoke-v1

