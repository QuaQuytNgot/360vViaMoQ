# Audited moqx candidate configuration. This is deliberately draft-18-only.
# It is not proof that this candidate has passed the required local P1 smoke.
listeners:
  - name: draft18_only
    udp:
      socket:
        address: "127.0.0.1"
        port: 4433
    tls:
      insecure: true # Local development only. Never use this in a remote run.
    endpoint: "/moq-relay"
    moqt_versions: [18]
    # P1 uses one client-initiated bidirectional control stream per Track
    # subscription.  The moqx default is 16, which makes a 24-Track run time
    # out at the 17th SUBSCRIBE even though the relay otherwise interoperates.
    # Keep this explicit so the qualifying configuration supports the P1
    # matrix without changing the MOQT draft or transport semantics.
    quic:
      max_bidi_streams: 64

service_defaults:
  cache:
    enabled: true
    max_tracks: 100
    max_groups_per_track: 3

services:
  local:
    match:
      - authority: {any: true}
        path: {prefix: "/"}

admin:
  address: "127.0.0.1"
  port: 8000
  plaintext: true
